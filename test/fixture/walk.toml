# The walk `manual.py` offers: the cases only a person in a real terminal can
# judge, in order, each with the one question to answer about it.
#
# `e2e.py` already holds every case to what a capture can show. What is left is
# what no capture can: how a terminal draws a wide character or a bold, whether
# a colour can be read against the reader's own ground, whether a report reads
# right against the cells it is about. `MANUAL.md` has the whole of each, in the
# section its key names; a step is the question that section ends on, and what
# to look at to answer it.
#
# `W n` goes to the next step and `W p` back, putting Yazi in the step's case
# under the step's theme. `W y` and `W x` record a verdict on it and go on,
# `W d` opens the section whole, and `W h` puts the guide away.
#
# `case` is a `[[case]]` id in `cases.toml`, and `theme` a `[[theme]]` name,
# `default` when it is left out: the walk puts the theme in place at every
# step, so a step reads the same whether it was reached forwards, backwards, or
# after a theme key pressed by hand. `setup.py` refuses a step whose key no
# section heading names.
#
# `ask` is drawn in bold under the guide's heading and `look`, when there is
# one, under it, an item to a row: what the reader checks, and none of why --
# the section has that, and is `W d` away. So `setup.py` holds each to a row
# of the guide on an 80-column terminal, and `look` to three items.
#
# `gallery = true` puts a step in `gallery.py` as well, which draws its capture
# on seven terminal grounds at once and asks the same question. Only a step a
# capture can answer: one about colour against a ground, and not one about how
# a terminal draws a bold or a wide character, what happens after a key, or a
# report, which lands after the capture rather than in it -- `setup.py`
# refuses a broken case there.
#
# A broken case is shown once and no more, and `setup.py` refuses a walk that
# shows one twice: `told` reports a column once per session, so a second step
# on it would ask about a notification that is not coming. They come last, and
# `setup.py` refuses a working case after them, since a report lands late over
# whatever is drawn next and `b f`'s step arms a `refresh` that throws at every
# `cd` after it.

[[step]]
case = "plain"
ask  = "Hover over never-opened. Does its - turn into 1?"
look = [
	"Directories show how many entries they hold, so nested shows 2.",
	"Press m s: Yazi's own size linemode should show the same numbers.",
]

[[step]]
case = "overflow"
ask  = "Do the Japanese and emoji names line up with the other rows?"
look = [
	"Only the first column ends a cut name with an ellipsis.",
	"No character is cut in half, and no column is a cell short.",
	"The fourth column runs past twelve cells and pushes the name over.",
]

[[step]]
case    = "c_ramp"
gallery = true
ask     = "Does the colour climb evenly, with no flat stretch or jump?"
look    = [
	"The two cells on a row should always be the same colour.",
	"The ramp is 64 rows long, so scroll to see all of it.",
]

[[step]]
case    = "c_spread"
gallery = true
ask     = "Can you read the first rows against your terminal's background?"
look    = [
	"The two columns should look exactly the same.",
	"The rows should read as a gradient, not as 64 shades of one colour.",
]

[[step]]
case    = "c_hue"
gallery = true
ask     = "Does the grey-green in the middle still read as a colour?"
look    = ["Both ends should be easy to read as well."]

[[step]]
case    = "c_bg"
gallery = true
ask     = "Do columns 2 to 4 fill their width, and can you read column 2's date?"
look    = [
	"Every row should carry the same background, wider than its text.",
	"The text in the fourth column does not need to be readable.",
]

[[step]]
case = "c_bold"
ask  = "Are the first two columns one colour, with the left one heavier?"
look = [
	"The permissions column should keep its reds and greens.",
	"If your terminal draws bold brighter rather than heavier, that is not a bug.",
]

[[step]]
case = "c_attrs"
ask  = "Does each word look like what it says?"
look = [
	"hidden should show as six empty cells.",
	"blink and blink_rapid may blink at the same rate.",
	"A word drawn plain may be your terminal not supporting it.",
]

[[step]]
case    = "c_scale"
gallery = true
ask     = "Does the left column read as a gradient?"
look    = ["The right one should be one colour, with a few bright rows at the bottom."]

# Not in the gallery: `e2e.py` holds these colours to the theme, and the ramp
# is `c_ramp`'s, already drawn on every ground. What a reader needs it for is
# the step after, which asks whether all of it changed.
[[step]]
case = "c_theme"
ask  = "Is size orange, mtime a blue ramp, and ext magenta?"
look = [
	"mtime should be bold as well.",
	"Press T to reload the theme; nothing should change.",
]

[[step]]
case  = "c_theme"
theme = "alt"
ask   = "Did every column take its new colour as soon as the theme changed?"
look  = [
	"The ramp should change too, not only the flat colours.",
	"mtime should still be bold.",
]

[[step]]
case    = "c_theme"
theme   = "bg"
gallery = true
ask     = "Do size and ext now have a background, while mtime does not?"

[[step]]
case = "b_render"
ask  = "Does the notification name the column filled with !s?"
look = [
	"The cell should be six !s rather than left blank.",
	"size and mtime should stay where they were.",
]

[[step]]
case = "b_stats"
ask  = "The row looks normal. Does the notification say what threw?"
look = ["The notification should name the column."]

[[step]]
case = "b_width"
ask  = "Does the notification say the width function threw?"
look = [
	"The column is unpadded: dir takes 3 cells and file takes 4.",
	"mtime stays in its place, and size takes up the difference.",
]

[[step]]
case = "b_zero"
ask  = "The cells look like b w's. Does this notification read differently?"
look = ["This time supaline refused a width of 0; nothing threw."]

[[step]]
case = "b_range"
ask  = "Does the notification say what stats has to return?"
look = [
	"The left column climbs, while the right one stays a single colour.",
	"The right column shows four dashes instead of a number.",
]

[[step]]
case = "b_tick"
ask  = "Press g 1. Does only the right counter go up?"
look = [
	"The left counter should stay where it was.",
	"Moving between g 1 and g 2 should not bring the notification back.",
]
