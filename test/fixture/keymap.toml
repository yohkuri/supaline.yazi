# The fixture's keymap, copied to `config/keymap.toml` by `test/setup.py`.
#
# Only the key that names no state is written here: `T` reloads whatever
# `theme.toml` holds, which is what `e2e.py` presses after rewriting that file
# in place. Every folder, case and theme has a key too, and those are in
# `cases.toml`, which `setup.py` turns into bindings appended to this file as
# it is copied -- a case's key, its folder and its linemode are then written in
# one place rather than two.

[[mgr.prepend_keymap]]
on   = "T"
run  = "app:theme"
desc = "Reload the theme"
