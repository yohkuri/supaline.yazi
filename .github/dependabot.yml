# Version updates for the actions the workflows name under `uses:`. Security
# updates are switched on in the repository's settings and need nothing here.
#
# `prefix: ci` is not optional. Left to itself Dependabot titles a commit
# "Bump actions/checkout from 7 to 8", which `Commit messages` refuses for
# having no type. The prefix does not decide the case of the word after it,
# though, and here that word arrives as "Bump", which `subject-case`
# refuses: lower it by hand before the pull request lands.
#
# Read off dependabot-core's `pr_name_prefixer.rb`: the case follows the last
# commit Dependabot authored among the latest hundred on main, and with none
# there it is capitalised when every conventional message in that hundred
# has a capital after a colon anywhere in it. A `Co-Authored-By:` trailer is
# one, so a history of lower-case subjects counts as capitalised -- measured
# on main, where removing that trailer turns 99 of 100 messages lower-case.
# A lowered "ci: bump ..." that lands would decide the next one, but only
# from inside that hundred, and on main a hundred commits span under two
# weeks against a monthly schedule -- so expect every one to need lowering.
#
# The rest of a real Dependabot message passes `.commitlintrc.yml` and the
# ASCII and Gitmoji steps: the body's lines over 100 characters each carry a
# URL, and commitlint's line limit skips those.
#
# No `groups`, on purpose. A group holding one update titles it "... in the
# actions group", and `astral-sh/setup-uv` from 10.1.0 to 10.10.0 comes to 71
# characters that way, one under the hard limit, where the same update alone
# is 50. Four actions checked monthly do not make enough pull requests to be
# worth folding together.
#
# What this cannot reach is a version written as data rather than as a
# `uses:` -- stylua's `version:`, the LuaLS release URL, and the `npx` and
# `uvx` pins. Those still move by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A week between a release and the pull request for it, so that a tag
    # pulled or rewritten soon after it went out is not the one proposed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
