name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --color always --check .

      # stylua only looks at .lua files, so the examples in the docs are
      # checked separately. The action leaves stylua on PATH for us.
      - name: Lua in Markdown
        run: python3 scripts/fmt-md.py --check README.md CLAUDE.md

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Unit tests
        run: lua5.4 test/run.lua
