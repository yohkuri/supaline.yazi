name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  # A pull request's superseded run is worth cancelling: every job in it reads
  # the tree, and the next run reads the same tree again. A push's run is not.
  # `landed` below reads a *range*, `before..sha`, and a range a cancelled run
  # was carrying is examined by nothing, ever -- it has already happened once
  # here, when two pull requests merged twelve seconds apart.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Two suites in two languages, for the two things under `test/`. 5.5,
    # because that is the Lua Yazi runs: no other version has a claim on the
    # plugin, which is only ever loaded by Yazi.
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - run: lua test/run.lua
      - name: The screen parsers
        # `test/screen.py` is the arithmetic that decides whether a ramp
        # climbed, a band covered its padding, and a bold landed on the right
        # side. It is pure -- no process, no file, no clock -- which is why it
        # is a file of its own and why this step can exist at all: `e2e.py`
        # around it needs a real Yazi and a real terminal and is not here.
        #
        # Before that split those parsers were `awk` inside the shell harness
        # and nothing tested them, which is the quietest hole a test harness
        # can have: a parser that stopped matching reports no faults, and no
        # faults reads as a ramp that climbed.
        #
        # The runner's own `python3` is enough. These import nothing outside
        # the standard library, deliberately -- a harness that needed a lock
        # file to run would be one more thing between a contributor and the
        # suite.
        run: python3 -m unittest discover -s test -p 'test_*.py'

  format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned, not `latest`: a stylua release that changes its defaults would
      # otherwise fail CI on files the local hook had just formatted.
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  types:
    # `.luarc.json` is upstream's, verbatim, and points `workspace.library` at
    # a path in the developer's home directory. Installing the annotations
    # there rather than pointing the config somewhere a runner likes better
    # keeps this job checking exactly what a contributor's editor checks.
    name: lua-language-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Yazi's annotations, where .luarc.json looks for them
        # Their own step, because a missing library does not fail the check --
        # it quietly reduces it to what this repository declares about itself,
        # and a tree with nothing else wrong then passes. Here a failure to
        # fetch them is a failure.
        #
        # Pinned like every other tool: these annotations follow Yazi's main
        # branch, and a plugin that targets 26.9.1 has no business failing on
        # ones written for the release after it.
        run: |
          git clone -q --filter=blob:none \
            https://github.com/yazi-rs/plugins /tmp/plugins
          git -C /tmp/plugins checkout -q 0be29a9
          mkdir -p ~/.config/yazi/plugins
          cp -R /tmp/plugins/types.yazi ~/.config/yazi/plugins/
      - name: None of them shadow this plugin's own modules
        # A `require` is resolved by file name, and `workspace.library` is
        # searched along with the workspace. At 0be29a9 these annotations hold
        # one Lua file, `main.lua`, which is why `require(".main")` in a spec
        # reaches 3,235 lines of annotations rather than this plugin on this
        # runner -- `supaline.Main` and `module_spec.lua` are the repair for
        # that one. A second such file would do the same to another module in
        # silence: the check below still passes, having compared the plugin
        # against something nobody here wrote.
        #
        # Which of two files of one name wins is a property of the absolute
        # path each sits at, so this step does not work the winner out. A name
        # the library ships twice is reported wherever the runner puts the
        # checkout, which is the conservative direction and the only one that
        # survives someone moving it.
        # `annotate-supaline/references/main-collision.md` has the measurement.
        #
        # Matched by name anywhere under the library, not just beside
        # `main.lua`. `runtime.pathStrict` defaults to false, so `?.lua` is
        # tried against every subdirectory of a library root: measured on
        # 3.19.1 by planting an annotation file with no `return` at
        # `nested/column.lua` and at `a/b/c/column.lua`, each of which took
        # `--check` from refusing a misspelled `column.normalizze` to
        # reporting no problems at all. Turning `runtime.pathStrict` on would
        # narrow it to the root; `.luarc.json` is copied verbatim from
        # yazi-rs/plugins and stays that way.
        #
        # Read off the tree rather than from a list of names, so a plugin file
        # added tomorrow is covered without anyone remembering to come back
        # here. Beside the clone rather than in a job of its own, and no
        # network either way: a library that shadows a module weakens the
        # check exactly as a missing one does.
        #
        # The harness is left out because nothing in it is reachable this way
        # -- `run.lua` loads the stub and the specs by absolute path, with
        # `dofile` and `loadfile`, and only the plugin's own modules are ever
        # required by name.
        #
        # A library that is not there is a silent pass rather than an error,
        # so the guard below is not the clone step's failure said twice:
        # `find` does fail per file, but `sort` exits 0 over the empty output
        # and `bash -e` sees a pipeline that succeeded, so the loop reports no
        # collisions and the step exits 0. Unreachable while the clone runs
        # first in this job; the guard is what makes reordering the two safe.
        run: |
          rc=0
          lib="$HOME/.config/yazi/plugins/types.yazi"
          if [ ! -d "$lib" ]; then
            echo "$lib is not there."
            echo "  The step that clones Yazi's annotations has to run before"
            echo "  this one. Without them there is nothing to compare this"
            echo "  plugin's module names against, and the walk below would"
            echo "  report no collisions rather than say it checked nothing."
            exit 1
          fi
          while IFS= read -r -d '' f; do
            # The collision that already happened. It is worked around and
            # pinned rather than fixed, so failing on it would fail every run.
            [ "$f" != main.lua ] || continue

            hits=$(find "$lib" -type f -name "${f##*/}" | sort)
            [ -n "$hits" ] || continue
            echo "$f: types.yazi ships a file of the same name:"
            while IFS= read -r hit; do
              echo "    ${hit#"$lib"/}"
            done <<< "$hits"
            echo "  A require of that name can reach the annotations rather"
            echo "  than this tree, so the check below may say nothing about"
            echo "  this module. The reference file"
            echo "  annotate-supaline/references/main-collision.md says"
            echo "  \`.main\` is the only name that can collide -- it is not"
            echo "  any more. Re-measure which module each require reaches,"
            echo "  and move that section."
            rc=1
          done < <(git ls-files -z '*.lua' ':!:test/*')
          exit $rc
      - name: The server itself
        # There is no npm package, so a release tarball. The archive puts the
        # launcher at `bin/`, which is why nothing here globs for it.
        run: |
          curl -fsSL -o /tmp/luals.tar.gz \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          mkdir -p /tmp/luals
          tar -xzf /tmp/luals.tar.gz -C /tmp/luals
      # `--check` prints every diagnostic and exits 1 on the first warning.
      - run: /tmp/luals/bin/lua-language-server --check .

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `.githooks` holds hooks and nothing else -- a README there would
      # fail this step on SC2148 rather than be skipped, which is the right
      # way round for a directory git executes every file in.
      #
      # The hooks are the only shell this repository keeps. `test/` was shell
      # too until the harnesses were rewritten in Python; what lints them now
      # is the ruff step in `Documents and skills`.
      - run: shellcheck .githooks/*

  docs:
    # Not `markdownlint` any more: it runs that, then the skills against the
    # specification, then ruff over the script that does the second. A job
    # name that names one of the three is a name for the one nobody looks up.
    name: Documents and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same command `.markdownlint-cli2.yaml` documents, and the same one
      # to run by hand -- there is no configuration here for CI to get wrong.
      # `gitignore: true` in that file needs the checkout to be a repository,
      # which it is.
      - run: npx --yes markdownlint-cli2@0.19
      # uv, for one script and one reason: `.github/scripts/skills.py` carries
      # its own `skills-ref` pin in a PEP 723 header, and `uv run` is what
      # reads it. Nothing else here needs Python, and no version of it is
      # named twice.
      #
      # A release rather than the major tag every other action here is given:
      # this one publishes no bare major past v7, and `@v10` is a run that
      # fails to start rather than a job that runs against something newer.
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Skills match the Agent Skills specification
        # The same command to run by hand, and the script says what it checks
        # and what it leans on. `skills.py.lock` beside it pins what the PEP
        # 723 header cannot -- `strictyaml`, which is what actually refuses a
        # duplicate key -- and `uv run` reads it with no flag here or there.
        #
        # The frontmatter half is `skills-ref`, the reference library the
        # specification points at for exactly this -- so the limits, the name
        # rules and an undefined field are its answers, taken off a real YAML
        # parse rather than the `awk` that stood here. The rest is this
        # repository's own, and the script says which is which and why, beside
        # each rule. Do not keep a second copy of that list here.
        run: uv run .github/scripts/skills.py
      - name: ruff, over the Python here
        # The lint, and then the shape. `ruff.toml` holds the rules and the
        # 80-column wrap; unlike `stylua.toml` beside it, that file is this
        # repository's own rather than upstream's, and says so.
        #
        # Both commands run whatever the first one says: `run:` is `bash -e`,
        # so an unguarded `check` that fails would take `format --check` with
        # it and report half of what is wrong. Every other step here that runs
        # more than one check accumulates into `rc` for the same reason; the
        # ones that run a single command have nothing to lose after it.
        #
        # Two paths rather than the tree every other linter here is given,
        # because the two halves of ruff do not walk the same tree: `check .`
        # reaches the Python, and `format --check .` reaches the documents too
        # -- it formats the Python inside a fenced block, so those would be
        # markdownlint's and ruff's at once. Measured on 0.16.7.
        #
        # `uvx` rather than `uv run`: ruff is a tool this repository runs, not
        # something `skills.py` imports, so the pin belongs on the command and
        # not in that script's header. Pinned for the reason stylua is -- a
        # release that adds a rule would otherwise fail a branch nobody
        # touched.
        run: |
          rc=0
          uvx ruff@0.16.7 check test .github/scripts || rc=1
          uvx ruff@0.16.7 format --check test .github/scripts || rc=1
          exit $rc
      - name: Every skill is reachable from .claude/skills
        # Claude Code reads `.claude/skills`; the skills live under
        # `.agents/skills` where every agent can reach them, and a tracked
        # symlink joins the two. A missing one is invisible from inside the
        # skill and silent at the other end -- the skill is simply never
        # offered. `document-supaline` carried this as a paragraph until it
        # became a check, which is the order that section asks for.
        run: |
          rc=0
          for d in .agents/skills/*/; do
            n=$(basename "${d%/}")
            l=".claude/skills/$n"
            if ! git ls-files --error-unmatch "$l" >/dev/null 2>&1; then
              echo "$l: not tracked. Claude Code will not see \`$n\`."
              echo "  ln -s ../../.agents/skills/$n $l && git add $l"
              rc=1
              continue
            fi
            t=$(readlink "$l" || true)
            [ "$t" = "../../.agents/skills/$n" ] || {
              echo "$l: points at \`$t\`, not \`../../.agents/skills/$n\`."
              rc=1
            }
          done
          for l in .claude/skills/*; do
            [ -L "$l" ] || [ -e "$l" ] || continue
            n=$(basename "$l")
            [ -d ".agents/skills/$n" ] || {
              echo "$l: nothing at .agents/skills/$n for it to point at."
              rc=1
            }
          done
          exit $rc

  since:
    # Yazi enforces the annotation: a plugin file without it does not load, and
    # the failure is a refusal to start rather than anything subtle.
    name: "@since annotations"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every plugin file declares one
        run: |
          rc=0
          # Every tracked Lua file outside the test harness is a plugin file,
          # wherever it sits -- a glob of the root would miss one added in a
          # subdirectory. The version is pinned rather than left open because
          # an annotation older than the Yazi it names is exactly the stale
          # one this job exists to catch; AGENTS.md holds the number.
          # Fed by process substitution, not a pipe, so the loop runs in this
          # shell and `rc` survives it -- every offender is named, not just
          # the first.
          while IFS= read -r -d '' f; do
            if ! head -1 "$f" | grep -q '^--- @since 26\.9\.1$'; then
              echo "$f: first line is not '--- @since 26.9.1'"
              rc=1
            fi
          done < <(git ls-files -z '*.lua' ':!:test/*')
          exit $rc

  sync:
    # Yazi binds a `ya.sync` block to the position of the call and matches the
    # sync and async sides by it, so a call written inside an `if`, a loop or a
    # function writes to a different state table than the same call at the top
    # level. Nothing says so at runtime; the state is simply empty. This is the
    # check that catches the first one, before there is a first one.
    name: "ya.sync placement"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every call is unconditional, and in main.lua
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            # Line comments go first. Every mention of `ya.sync` in this
            # repository today is prose about the rule, and a check that fires
            # on prose is one nobody keeps.
            calls=$(sed 's/--.*//' "$f" | grep -n 'ya\.sync[[:space:]]*(' || true)
            [ -n "$calls" ] || continue

            if [ "$f" != "main.lua" ]; then
              echo "$f: ya.sync may only be called from main.lua"
              rc=1
            fi

            # stylua indents this repository with tabs, so a call starting in
            # column 0 is exactly one that no condition or loop encloses.
            nested=$(printf '%s\n' "$calls" | grep '^[0-9]*:[[:space:]]' || true)
            if [ -n "$nested" ]; then
              printf '%s: ya.sync is not at the top level:\n%s\n' "$f" "$nested"
              rc=1
            fi
          done < <(git ls-files -z '*.lua' ':!:test/*')
          exit $rc

  spellings:
    # Two Yazi APIs whose obvious use is the wrong one, and which this plugin
    # therefore never uses. Both checks are refusals with a reason rather than
    # lint for its own sake -- the reason is the whole payload, because the
    # right spelling is not guessable from the wrong one. If a real use ever
    # turns up, change the check; needing to should take a moment's thought.
    #
    # This is what a documented trap looks like once it can be caught. Neither
    # of these fails a test: the unit suite pins the existing code, so a *new*
    # column written the wrong way passes it green.
    name: Forbidden spellings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The plugin does not use these
        run: |
          rc=0
          # Line comments go first: both names are discussed in prose here, and
          # a check that fires on prose is one nobody keeps.
          forbid() { # <pattern> <what to write instead>
            while IFS= read -r -d '' f; do
              hits=$(sed 's/--.*//' "$f" | grep -n "$1" || true)
              [ -n "$hits" ] || continue
              printf '%s:\n%s\n%s\n\n' "$f" "$2" "$hits"
              rc=1
            done < <(git ls-files -z '*.lua' ':!:test/*')
          }

          forbid 'in_preview' \
            '  `in_preview` holds for the previewed folder'"'"'s cursor row alone, not
            for the pane. Ask the preview folder whether the row is one of its
            own instead: `file.idx` is its 1-based position in its own folder,
            so `folder.files[file.idx]` settles it in O(1).'

          forbid 'is_regular' \
            '  `is_regular` holds for one of six AuthKind variants, so a check
            written as `not is_regular` demotes every search hit along with the
            remote ones. Use `spec.is_virtual`, which is the exposed complement
            of Yazi'"'"'s own `AuthKind::is_local()`.'

          exit $rc

  commits:
    # Only on a pull request: this is the last point at which a message can
    # still be rewritten without touching published history.
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The default shallow clone has neither end of the range.
          fetch-depth: 0
      - name: Conventional Commits
        # Pinned to a major. config-conventional tightens and adds rules
        # between them, and a check that changes on its own is one that fails
        # on a branch nobody touched.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >
          npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21
          commitlint --from "$BASE" --to "$HEAD"
      - name: English headers, and no Gitmoji
        # Neither is something commitlint knows about, and the first is what
        # lets its character counts mean columns.
        #
        # POSIX `tr` and `grep -E` only. The obvious spelling of both tests is
        # `grep -P`, which BSD grep does not have -- and `if ... grep -q`
        # reads grep's refusal to run as "no match", so the check would pass
        # everything on any machine without it. Failing open is worse than not
        # checking at all.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          for rev in $(git rev-list --no-merges "$BASE..$HEAD"); do
            header=$(git log -1 --format='%s' "$rev")
            message=$(git log -1 --format='%B' "$rev")

            # `header-max-length` counts characters, and a character occupies
            # one column only while the text is ASCII. Requiring an ASCII
            # header therefore does two jobs at once: it keeps that limit
            # meaning what it says, and it applies the Language section to the
            # one line `git log --oneline` shows. It also settles emoji there,
            # since none of them are ASCII.
            #
            # Bodies are deliberately exempt. A commit explaining width
            # arithmetic may quote a CJK string -- one in this history does --
            # and a contributor's name in a trailer is theirs to spell.
            if [ -n "$(printf '%s' "$header" | LC_ALL=C tr -d '\000-\177')" ]; then
              echo "${rev:0:8} header is not ASCII: $header"
              rc=1
            fi

            # Gitmoji shortcodes are ASCII, so the test above does not see
            # them. Bounded by whitespace or a line end, which is what keeps
            # `3:30:00` and `key: value` out of it.
            if printf '%s' "$message" \
              | grep -qE '(^|[[:space:]]):[a-z0-9][a-z0-9_+-]*:([[:space:]]|$)'; then
              echo "${rev:0:8} carries a Gitmoji shortcode: $header"
              rc=1
            fi
          done
          exit $rc

  landed:
    # The counterpart of `commits` above, and the reason that job can stay on
    # pull requests alone: what it reads is only ever read there, so a commit
    # that reached main another way is one whose message nothing checked.
    # `.githooks/pre-push` refuses the push that would do it; this is what a
    # clone that never installed the hooks runs into, after the fact.
    #
    # Three things are asked of every commit that lands, because "a pull
    # request exists" is weaker than it sounds: the pull request it came from
    # has to be *merged* (an open one also reports the association, so a
    # branch pushed straight to main while its own pull request sat open would
    # otherwise pass), it has to have targeted main, and `Commit messages` has
    # to have concluded `success` on its head. Nothing here reads a merge
    # commit's own message -- `commits` skips those deliberately -- but a
    # merge commit still has to belong to a merged pull request, which is what
    # a `git pull` merge pushed to main would not.
    #
    # An API that does not answer is reported as itself rather than as a
    # violation. The distinction matters: this job runs on main, where a red
    # cross saying "install the hook" for a commit that came through a pull
    # request perfectly is the kind of noise a check gets ignored for.
    #
    # It says what it walked and how many commits it read even when it passes.
    # A green job that printed nothing is a job that read two commits and a
    # job that read none, and the log cannot tell them apart -- which is the
    # shape of every check here that turned out to be checking nothing.
    #
    # `run:` is `bash -e`, so every command substitution is guarded -- an
    # unguarded one would abort the step in the middle and report nothing.
    name: Commits on main came from a pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The default shallow clone has neither end of the range.
          fetch-depth: 0
      - env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          seen=0

          # A branch's first push reports an all-zero `before` and there is no
          # range to walk from it; main is created once, and its tip is what
          # there is to look at. A `before` that is no longer reachable -- a
          # force push -- is not a range either, and saying so beats printing
          # git's own complaint and stopping.
          case "$BEFORE" in
            *[!0]*)
              revs=$(git rev-list "$BEFORE..$AFTER" 2>/dev/null) || {
                echo "$BEFORE..$AFTER is not walkable here, so nothing was"
                echo "checked. A force push to main is the usual reason, and"
                echo "the range it discarded has to be read by hand."
                exit 1
              }
              echo "walking $BEFORE..$AFTER"
              ;;
            *)
              revs=$AFTER
              echo "main was created by this push; its tip is what there is"
              echo "to examine."
              ;;
          esac

          for rev in $revs; do
            seen=$((seen + 1))

            # The association can lag a merge by a moment, which is what the
            # attempts are for; the sleep is between them, not after the last.
            pr=
            failed=
            for attempt in 1 2 3; do
              failed=
              pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$rev/pulls" --jq \
                '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty') \
                || failed=1
              [ -z "$failed" ] && [ -n "$pr" ] && break
              [ "$attempt" = 3 ] || sleep 10
            done

            if [ -n "$failed" ]; then
              echo "${rev:0:8} the pull request API did not answer."
              echo '  This is the check failing to run, not the commit failing'
              echo '  it. Re-run the job; if it keeps happening, look at the'
              echo '  token and the rate limit rather than at the commit.'
              rc=1
              continue
            fi

            if [ -z "$pr" ]; then
              echo "${rev:0:8} reached main without a merged pull request:"
              git log -1 --format='  %s' "$rev"
              echo '  `Commit messages` never read it -- that job runs on a'
              echo '  pull request alone. AGENTS.md has the two lines that'
              echo '  install the hooks which refuse this before it happens.'
              rc=1
              continue
            fi

            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha) || head=
            verdict=
            [ -z "$head" ] || verdict=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$head/check-runs" --jq \
              '[.check_runs[] | select(.name == "Commit messages")][0].conclusion // empty') \
              || verdict=

            if [ -z "$head" ] || [ -z "$verdict" ]; then
              echo "${rev:0:8} came from #$pr, whose \`Commit messages\` could"
              echo '  not be read. As above: the check failed to run.'
              rc=1
            elif [ "$verdict" != success ]; then
              echo "${rev:0:8} came from #$pr, where \`Commit messages\`"
              echo "  concluded \`$verdict\`. The message on main is one the"
              echo '  job had already refused; branch protection is what stops'
              echo '  a merge over a red check, and AGENTS.md says where that'
              echo '  stands.'
              rc=1
            fi
          done

          if [ "$seen" = 0 ]; then
            echo 'That range held no commits, so nothing was examined.'
          elif [ "$rc" = 0 ]; then
            echo "$seen commit(s) examined, each from a pull request merged"
            echo 'into main with `Commit messages` concluded `success`.'
          fi
          exit $rc

# `test/e2e.py` and `test/manual.py` are deliberately not here. They need a
# real Yazi binary and a real terminal, and what they check -- rendering, and
# how wide a cell came out -- is not what a runner is good at. Run them locally
# before saying that anything about the screen works.
#
# What *is* here is the half of `e2e.py` that needs neither: `test/screen.py`
# reads a capture and is tested by `test/test_screen.py` in the `Unit tests`
# job. That is new ground rather than a restatement -- those parsers were
# `awk` and had no test at all.
