# The two tools whose version decides whether CI agrees with a contributor:
# another stylua can format the same file differently, and another
# lua-language-server can report what this one does not. CI installs both from
# here, `The documents name the versions CI runs` in `check.yml` holds
# `CONTRIBUTING.md`'s table to them, and `.claude/hooks/format-lua.sh` refuses
# to format with a stylua other than this one. mise is optional; without it,
# install these versions by hand.
#
# Each as `name = "version"` on one line, with the full version: the hook and
# that step read them line by line rather than through a TOML parser, and the
# step refuses any other shape it finds under `[tools]`.
#
# Lua, uv and Python stay out, because none of their versions matters: any 5.5
# runs the suite, `skills.py` resolves what it needs from its own lock, and the
# harnesses ask for 3.11 or newer. A pin nothing depends on reads as one that
# something does, and sends a contributor to a version manager for nothing.
[tools]
lua-language-server = "3.19.2"
stylua = "2.6.0"
